# Truffle requires a language's generated node classes to be initialised at image build time: their
# static initialisers register inline-support fields that cannot be created at run time. Those classes
# live in org.pkl.core.ast and org.pkl.core.stdlib. The rest of pkl-core stays at run time, because
# evaluating Pkl during the image build (which the standard-library holders in org.pkl.core.runtime
# do in their static initialisers) enters a Truffle context on the build workers and leaks their
# threads into the image heap. Runtime and utility classes whose constants the node classes embed are
# listed individually.
Args = --initialize-at-build-time=org.pkl.core.ast,org.pkl.core.stdlib,org.pkl.parser,org.pkl.core.util.paguro,org.organicdesign.fp,org.snakeyaml.engine,org.msgpack,org.pkl.core.runtime.Identifier,org.pkl.core.runtime.VmExceptionRenderer,org.pkl.core.runtime.VmLanguageProvider,org.pkl.core.runtime.VmSet,org.pkl.core.runtime.VmValueRenderer,org.pkl.core.util.ArrayCharEscaper \
       --initialize-at-run-time=org.msgpack.core.buffer.DirectBufferAccess
