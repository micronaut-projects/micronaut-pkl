plugins {
    id 'java-gradle-plugin'
    id 'io.micronaut.build.internal.pkl-module'
}

tasks.register('generatePomFileForMavenPublication', org.gradle.api.publish.maven.tasks.GenerateMavenPom) {
    pom = publishing.publications.named('pluginMaven').get().pom
    destination = layout.buildDirectory.file('publications/maven/pom-default.xml').get().asFile
}

// The Micronaut module convention checks a publication named "maven", while
// java-gradle-plugin publishes the implementation artifact as "pluginMaven".
// Reuse the real plugin POM for that check without adding a duplicate publication.
afterEvaluate {
    publishing.publications.named('pluginMaven') {
        pom.withXml {
            def micronautVersion = libs.versions.micronaut.asProvider().get()
            asNode().dependencies.dependency.each { dependency ->
                if (dependency.groupId.text() == 'io.micronaut' &&
                    dependency.artifactId.text() == 'micronaut-inject' &&
                    dependency.version.isEmpty()) {
                    dependency.appendNode('version', micronautVersion)
                }
            }
        }
    }
}

// The plugin adds micronaut-pkl-aot of its own version to the AOT optimizer's classpath
def versionResources = layout.buildDirectory.dir('generated/version-resources')
def writePluginVersion = tasks.register('writePluginVersion', WriteProperties) {
    destinationFile = versionResources.map { it.file('io/micronaut/pkl/gradle/micronaut-pkl-gradle-plugin.properties') }
    property('version', project.version)
}
sourceSets.main.resources.srcDir(files(versionResources).builtBy(writePluginVersion))

dependencies {
    implementation projects.micronautPklGenerator
    testImplementation gradleTestKit()
    testImplementation mnTest.junit.jupiter.api
    testImplementation mn.micronaut.context
    testRuntimeOnly mnTest.junit.jupiter.engine
    testRuntimeOnly mnTest.junit.platform.launcher
}

gradlePlugin {
    plugins {
        pkl {
            id = 'io.micronaut.pkl'
            implementationClass = 'io.micronaut.pkl.gradle.PklPlugin'
        }
    }
}

micronautBuild {
    descriptor {
        parentModuleId = 'io.micronaut.pkl:micronaut-pkl-gradle-plugin'
    }
}

test {
    useJUnitPlatform()
}
